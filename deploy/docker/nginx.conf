server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the api container at request time (Docker DNS), so nginx survives api restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Live logs (M1) use Server-Sent Events, which must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Artifact uploads from agents: large bodies, streamed straight through (the API enforces
    # TORQRUN_MAX_ARTIFACT_BYTES; keep this at least that big).
    location ~ ^/api/v1/agent/attempts/[^/]+/artifacts/ {
        include /etc/nginx/snippets/security-headers.conf;
        client_max_body_size 110m;
        proxy_request_buffering off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 10m;
    }

    # Agent installer and packages (served by the API).
    location /agent/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { proxy_pass $api_upstream; }
    location = /readyz  { proxy_pass $api_upstream; }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
