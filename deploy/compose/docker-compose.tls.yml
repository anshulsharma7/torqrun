# Opt-in HTTPS for remote agents. Usage:
#   TORQRUN_DOMAIN=torqrun.example.com docker compose \
#     -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.tls.yml \
#     --project-directory . up -d
# This publishes ports 80 and 443 on ALL interfaces. Only do this deliberately, and enable
# authentication (TORQRUN_ENVIRONMENT=production) before exposing the control plane.
services:
  caddy:
    image: caddy:2-alpine
    environment:
      TORQRUN_DOMAIN: ${TORQRUN_DOMAIN:?set TORQRUN_DOMAIN (e.g. torqrun.example.com)}
      TORQRUN_CADDY_TLS: ${TORQRUN_CADDY_TLS:-}
    ports:
      - "${TORQRUN_HTTP_PORT:-80}:80"
      - "${TORQRUN_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  api:
    environment:
      # Install commands shown in the UI use this URL.
      TORQRUN_PUBLIC_URL: ${TORQRUN_PUBLIC_URL:-https://${TORQRUN_DOMAIN}}

volumes:
  caddy_data:
  caddy_config:
