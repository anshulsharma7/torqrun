[project]
name = "torqrun-scheduler"
version = "0.1.0.dev0"
description = "Torqrun scheduler: lease reaper, retry promotion and other background maintenance."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "torqrun-core",
  "torqrun-db",
]

[project.scripts]
torqrun-scheduler = "torqrun_scheduler.main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torqrun_scheduler"]
