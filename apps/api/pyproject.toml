[project]
name = "torqrun-api"
version = "0.1.0.dev0"
description = "Torqrun control-plane HTTP API."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "torqrun-core",
  "torqrun-db",
  "torqrun-protocol",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "argon2-cffi>=23.1",
  "prometheus-client>=0.21",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
torqrun-api = "torqrun_api.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torqrun_api"]
