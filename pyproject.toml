[project]
name = "torqrun-workspace"
version = "0.0.0"
description = "Workspace root for Torqrun (not published)."
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/agent", "apps/scheduler", "packages/*"]  # private repo adds the Enterprise package

[tool.uv.sources]
torqrun-agent = { workspace = true }
torqrun-api = { workspace = true }
torqrun-scheduler = { workspace = true }
torqrun-core = { workspace = true }
torqrun-db = { workspace = true }
torqrun-protocol = { workspace = true }

[dependency-groups]
dev = [
  "torqrun-agent",
  "torqrun-api",
  "torqrun-scheduler",
  "torqrun-core",
  "torqrun-db",
  "torqrun-protocol",
  "httpx>=0.28",
  "mypy>=1.15",
  "types-pyyaml>=6.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/agent/src", "apps/scheduler/src", "packages/torqrun-core/src", "packages/torqrun-db/src", "packages/torqrun-protocol/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S603", "PT018", "ASYNC110", "E501"]
"tests/**" = ["S101", "S105", "S106", "S603", "PT012", "PT018", "E501", "ASYNC240"]
"**/migrations/versions/*.py" = ["N999", "E501"]  # autogenerated DDL
"tools/bench/*.py" = ["E501", "RUF001", "S101", "ASYNC109"]  # a developer tool

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["apps/api", "apps/agent", "apps/scheduler", "packages", "tests"]
exclude = ["/migrations/"]
mypy_path = ["apps/api/src", "apps/agent/src", "apps/scheduler/src", "packages/torqrun-core/src", "packages/torqrun-db/src", "packages/torqrun-protocol/src"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/agent/tests", "apps/scheduler/tests", "packages/torqrun-core/tests", "packages/torqrun-db/tests", "packages/torqrun-protocol/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs a real PostgreSQL (set TORQRUN_TEST_DATABASE_URL)",
]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["."]
