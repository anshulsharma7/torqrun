[project]
name = "torqrun-core"
version = "0.1.0.dev0"
description = "Torqrun domain logic: run state machine and identifiers. No I/O."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  # IANA zone data for zoneinfo, so schedules work even where the OS ships none (slim images).
  "tzdata>=2025.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torqrun_core"]
