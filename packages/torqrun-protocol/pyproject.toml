[project]
name = "torqrun-protocol"
version = "0.1.0.dev0"
description = "Torqrun wire contract shared by the control plane and agents."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torqrun_protocol"]
